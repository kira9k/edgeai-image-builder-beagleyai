image beagleyai.img {
	hdimage {
		partition-table-type = "mbr"
	}
	partition boot {
		bootable = "true"
		partition-type = 0xc  // fat32
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83 // linux filesystem
		image = "rootfs.ext4"
	}
}

image boot.vfat {
	size = 128M
	vfat {
		label = "BOOT"
	}
	mountpoint = "fs-boot"
}

image rootfs.ext4 {
	size = "120%"
	ext4 {
		label = "rootfs"
	}
	mountpoint = "fs-rootfs"
}
